[project]
name = "project-atlas"
version = "0.1.0"
description = "AI-native knowledge engineering platform for enterprise document ingestion, enrichment, knowledge graph construction, and retrieval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Project Atlas Team" }
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "minio>=7.2.20",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "clamd>=1.0.2",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2.0",
    "aiosmtplib>=5.0.0",
    "python-jose[cryptography]",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = [
   "atlas_api",
    "modules",
]

